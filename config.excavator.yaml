# Konfigurasi mesin deteksi aktivitas alat berat.
# Tidak ada kredensial di file ini. Untuk RTSP, ambil URL dari environment.

timezone: Asia/Jakarta
unit: EXC-07

source:
  # kind: http (Raspberry Pi Zero W Dashcam live stream)
  kind: http
  path: "http://192.168.1.40:8080/stream.mjpg"
  url: "http://192.168.1.40:8080/stream.mjpg"
  loop: false
  fps: 30
  width: 640
  height: 480
  ffmpeg: false

detector:
  view: cabin               # cabin (dashcam boom POV) | external (profile CCTV)
  # Model dilatih sendiri untuk bucket + excavator. Truck ikut dilatih dari
  # label otomatis YOLO COCO supaya satu model cukup.
  model: runs/alat_berat_v4/weights/best.pt
  confidence: 0.18          # ambang deteksi dipakai (diuji: truck/bucket 18-25%)
  release_confidence: 0.12  # deteksi sekecil ini masih dipakai untuk posisi
  iou: 0.45
  device: "0"
  imgsz: 512
  classes: ["excavator", "truck", "bucket"]
  plate_model: weights/plate/license-plate-finetune-v1s.pt
  plate_confidence: 0.40
  plate_imgsz: 512
  min_width_ratio: 0.14     # abaikan objek sempit
  hold_seconds: 1.5         # kurangi penahanan agar tidak ada kotak hantu
  hold_mark_seconds: 0.8

zones:
  # zona gali tetap, normalized [x1, y1, x2, y2]
  dig: [0.05, 0.40, 0.95, 0.99]
  # zona tuang mengikuti bbox truck -> pintu bak di bagian atas
  dump_top_ratio: 0.12
  dump_height_ratio: 0.60
  motion_threshold: 0.08

activity:
  phase_min_seconds: 0.8    # transisi fase responsif (0.8 detik debounce)
  dump_min_seconds: 1.2     # truck diam sebegitu -> fase Menuangkan
  dig_min_seconds: 2.0      # gerak di zona gali sebegitu -> fase Mengeruk
  bucket_low_ratio: 0.55
  idle_seconds: 5.0

store:
  # DSN dikosongkan; diisi lewat environment EXCAVATOR_DSN bila diperlukan
  dsn: ""

server:
  host: "127.0.0.1"
  port: 8010                # 8000 dipakai aplikasi lain di mesin ini
  stream_fps: 32
  stream_quality: 68
  stream_width: 800
